name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci || npm install

      - name: Build Web Dist Bundle
        run: npm run build

      - name: Prepare Android Project Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r dist android/app/src/main/assets/

      - name: Setup Android SDK & Build APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.2.2 2>/dev/null || true
          chmod +x ./gradlew 2>/dev/null || true
          ./gradlew assembleDebug || gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TownshipVIP-Debug-APK
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/**/*.apk
